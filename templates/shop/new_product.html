{% extends 'base.html' %}
{% load crispy_forms_tags%}
{% block content %}
<title>{% block title %} Pulse - New Game {% endblock title %}</title>
<nav aria-label="breadcrumb">
    <br>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{% url 'pages:homepage' %}" aria-current="page">Home</a></li>
      <li class="breadcrumb-item"><a href="{% url 'pages:all_products' %}" aria-current="page">Product</a></li>
      <li class="breadcrumb-item active" aria-current="page">Create new game</li>
    </ol>
  </nav>
  <h1> Create new Game entry </h1>
  <form action="" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-success ml-2" type="submit">Save</button>
    </form>
{% endblock content %}
