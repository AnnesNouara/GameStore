{% extends 'base.html' %}
{% load static %}

{% block title %}Log In{% endblock title %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in</title>
</head>
<body>
  {% block content %}
 <br>
  <div class="card mx-auto shadow-sm p-4" style="max-width: 30rem;">
    <div class="card-body">
      <h5 class="text-center text-uppercase">Log in</h5>
      <hr class="rounded">
      <form class="" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary ml-2" type="submit">Log In</button>
        <br>
        <br>
          <a class="" href="{% url 'csignup' %}">Dont have an account?</a>
      </form>
    </div>
  </div>
{% endblock content %}

</body>
</html>
